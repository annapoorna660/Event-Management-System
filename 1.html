<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Event Registration System</title>

    <link rel="stylesheet" href="1.css">
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <div class="logo">
            <span class="logo-icon">E</span>
            <span>EventHub</span>
        </div>

        <div class="nav-links">
            <a href="#" class="active">Events</a>
            <a href="#">Registrations</a>
            <a href="#">Dashboard</a>
        </div>

        <div class="user-section">
            <span class="username">Admin</span>
            <div class="avatar">A</div>
        </div>

    </header>


    <!-- ================= MAIN CONTAINER ================= -->

    <main class="container">

        <!-- Page Header -->

        <section class="page-header">

            <div>
                <h1>Event Management</h1>

                <p>
                    Create, view and manage events
                </p>
            </div>

            <button
                class="create-btn"
                onclick="openCreateModal()">

                + Create Event

            </button>

        </section>


        <!-- ================= SEARCH ================= -->

        <section class="toolbar">

            <div class="search-box">

                <span>🔍</span>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search events..."
                    onkeyup="searchEvents()">

            </div>

            <div class="event-count">

                Total Events:
                <strong id="eventCount">0</strong>

            </div>

        </section>


        <!-- ================= MESSAGE ================= -->

        <div
            id="successMessage"
            class="success-message">

            Event deleted successfully.

        </div>


        <!-- ================= EVENTS ================= -->

        <section id="eventContainer" class="event-container">

            <!-- Events will be generated using JavaScript -->

        </section>

    </main>


    <!-- ================= CREATE EVENT MODAL ================= -->

    <div
        id="createModal"
        class="modal">

        <div class="modal-content">

            <div class="modal-header">

                <h2>Create Event</h2>

                <button
                    class="close-btn"
                    onclick="closeCreateModal()">

                    ×

                </button>

            </div>


            <div class="form-group">

                <label for="eventName">
                    Event Name
                </label>

                <input
                    type="text"
                    id="eventName"
                    placeholder="Enter event name">

            </div>


            <div class="form-group">

                <label for="eventDate">
                    Event Date
                </label>

                <input
                    type="date"
                    id="eventDate">

            </div>


            <div class="form-group">

                <label for="eventLocation">
                    Location
                </label>

                <input
                    type="text"
                    id="eventLocation"
                    placeholder="Enter location">

            </div>


            <div class="form-group">

                <label for="eventDescription">
                    Description
                </label>

                <textarea
                    id="eventDescription"
                    placeholder="Enter event description">
                </textarea>

            </div>


            <div class="modal-actions">

                <button
                    class="cancel-btn"
                    onclick="closeCreateModal()">

                    Cancel

                </button>

                <button
                    class="save-btn"
                    onclick="submitCreateEvent()">

                    Create Event

                </button>

            </div>

        </div>

    </div>


    <!-- ================= DELETE MODAL ================= -->

    <div
        id="deleteModal"
        class="modal">

        <div class="delete-modal-content">

            <div class="warning-icon">
                ⚠
            </div>

            <h2>Delete Event?</h2>

            <p>
                Are you sure you want to delete
                <strong id="deleteEventName"></strong>?
            </p>

            <p class="warning-text">
                This action cannot be undone.
            </p>


            <div class="modal-actions">

                <button
                    class="cancel-btn"
                    onclick="closeDeleteModal()">

                    Cancel

                </button>

                <button
                    class="delete-confirm-btn"
                    onclick="confirmDelete()">

                    Delete Event

                </button>

            </div>

        </div>

    </div>


    <script src="1.js"></script>

</body>
</html>
